global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ========== Application Services ==========
  - job_name: "order-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["order-service:8080"]
        labels:
          service: "order-service"

  - job_name: "inventory-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["inventory-service:8081"]
        labels:
          service: "inventory-service"

  - job_name: "websocket-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["websocket-service:8082"]
        labels:
          service: "websocket-service"

  - job_name: "auth-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["auth-service:8083"]
        labels:
          service: "auth-service"

  # ========== Traefik ==========
  - job_name: "traefik"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["traefik:8080"]
        labels:
          service: "traefik"

  # ========== OTel Collector ==========
  - job_name: "otel-collector"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          service: "otel-collector"

  # ========== Kafka ==========
  - job_name: "kafka"
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels:
          service: "kafka"

  # ========== Redis ==========
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: "redis"

  # ========== PostgreSQL ==========
  - job_name: "order-db"
    static_configs:
      - targets: ["order-db-exporter:9187"]
        labels:
          service: "order-db"

  - job_name: "inventory-db"
    static_configs:
      - targets: ["inventory-db-exporter:9187"]
        labels:
          service: "inventory-db"

# ========== Alert Rules ==========
rule_files:
  - "/etc/prometheus/alerts/*.yml"
