server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    join_after: 0s
    min_ready_duration: 1m
    final_sleep: 0s
  trace_idle_period: 10s
  complete_block_timeout: 1s

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 24h
    max_block_bytes: 1073741824

query_frontend:
  max_outstanding_per_tenant: 5000
  search:
    concurrent_jobs: 2000
    target_bytes_per_job: 104857600
    default_result_limit: 20
    max_duration: 168h
  trace_by_id:
    query_shards: 50

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: docker-compose
  storage:
    path: /var/tempo/generator/wal

target: all
