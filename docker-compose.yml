services:
  # ========== Databases ==========
  order-db:
    build:
      context: .
      dockerfile: cmd/order-db/Dockerfile
    container_name: order-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_db
    ports:
      - "5432:5432"
    volumes:
      - order_db_data:/var/lib/postgresql
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  inventory-db:
    build:
      context: .
      dockerfile: cmd/inventory-db/Dockerfile
    container_name: inventory-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory_db
    ports:
      - "5433:5432"
    volumes:
      - inventory_db_data:/var/lib/postgresql
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ========== Infrastructure ==========
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    logging:
      driver: journald
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8989:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Waiting for Kafka to be fully ready...'
      sleep 10
      
      echo 'Creating Kafka topics...'
      
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic order.created --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic order.paid --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic order.confirmed --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic order.cancelled --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic order.shipped --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic order.delivered --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic order.status.changed --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory.reserved --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory.released --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory.updated --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory.low_stock --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory.reservation_failed --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic dead_letter --partitions 3 --replication-factor 1
      
      echo 'Kafka topics created successfully!'
      "

  # ========== API Gateway ==========
  traefik:
    build:
      context: .
      dockerfile: cmd/traefik/Dockerfile
    container_name: traefik
    logging:
      driver: k8s-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.file.filename=/etc/traefik/traefik-dynamic.yml"
      - "--providers.file.watch=false"
      - "--entrypoints.web.address=:8088"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      - "--log.level=INFO"
    ports:
      - "8088:8088"
      - "8090:8080"
    depends_on:
      order-service:
        condition: service_started
      inventory-service:
        condition: service_started
      websocket-service:
        condition: service_started
      auth-service:
        condition: service_started

  # ========== Services ==========
  order-service:
    build:
      context: .
      dockerfile: cmd/order-service/Dockerfile
    container_name: order-service
    ports:
      - "8080:8080"
    logging:
      driver: k8s-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - DB_HOST=order-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=order_db
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - HTTP_PORT=8080
      - OTEL_ENDPOINT=otel-collector:4317
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  inventory-service:
    build:
      context: .
      dockerfile: cmd/inventory-service/Dockerfile
    container_name: inventory-service
    ports:
      - "8081:8081"
    logging:
      driver: k8s-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - DB_HOST=inventory-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=inventory_db
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - HTTP_PORT=8081
      - OTEL_ENDPOINT=otel-collector:4317
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  websocket-service:
    build:
      context: .
      dockerfile: cmd/websocket-service/Dockerfile
    container_name: websocket-service
    ports:
      - "8082:8082"
    logging:
      driver: k8s-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - HTTP_PORT=8082
      - OTEL_ENDPOINT=otel-collector:4317
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    depends_on:
      redis:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: cmd/auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "8083:8083"
    logging:
      driver: k8s-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - JWT_SECRET=${JWT_SECRET:-changeme}
      - JWT_ISSUER=${JWT_ISSUER:-order-inventory-system}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-order-inventory-api}
      - HTTP_PORT=8083
      - OTEL_ENDPOINT=otel-collector:4317
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ========== Observability ==========
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    container_name: otel-collector
    command: ["--config=/etc/otel/otel-collector.yml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "8889:8889"
    volumes:
      - ./config/otel/otel-collector.yml:/etc/otel/otel-collector.yml:ro,z
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    restart: always

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=50GB"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./config/prometheus/alerts:/etc/prometheus/alerts:ro,z
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    depends_on:
      - otel-collector
    restart: always

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    user: root
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: always

  loki:
    image: grafana/loki:3.1.0
    container_name: loki
    command: -config.file=/etc/loki/loki.yml
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki/loki.yml:/etc/loki/loki.yml:ro,z
      - loki:/loki
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    restart: always

  tempo:
    image: grafana/tempo:2.3.0
    container_name: tempo
    command: ["--config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"
    volumes:
      - ./config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro,z
      - tempo:/var/tempo
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: always

  k6-loadtester:
    image: grafana/k6:0.50.0
    container_name: k6-loadtester
    environment:
      - BASE_URL=http://traefik:8088
      - JWT_TOKEN=${JWT_TOKEN}
    volumes:
      - ./tests/load:/scripts:ro,z
    depends_on:
      traefik:
        condition: service_started
    profiles:
      - load-test

volumes:
  order_db_data:
  inventory_db_data:
  prometheus_data:
  grafana_data:
  loki:
  tempo:
