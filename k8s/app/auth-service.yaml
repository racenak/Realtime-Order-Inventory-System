apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: order-inventory
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/app
                    operator: In
                    values:
                      - "true"
      containers:
        - name: auth-service
          image: ghcr.io/racenak/realtime-order-inventory-system/auth-service:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
              protocol: TCP
          env:
            - name: JWT_SECRET
              value: changeme
            - name: JWT_ISSUER
              value: order-inventory-system
            - name: JWT_AUDIENCE
              value: order-inventory-api
            - name: HTTP_PORT
              value: "8083"
            - name: OTEL_ENDPOINT
              value: otel-collector:4317
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: order-inventory
  labels:
    app: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - port: 8083
      targetPort: 8083
      protocol: TCP
