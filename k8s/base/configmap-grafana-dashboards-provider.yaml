apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: order-inventory
data:
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: "default"
        orgId: 1
        folder: "Order Inventory"
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
