apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: order-inventory
data:
  otel-collector.yml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      redis:
        endpoint: "redis:6379"
        collection_interval: 10s

      kafkametrics:
        brokers: ["kafka:9092"]
        protocol_version: 2.0.0
        scrapers:
          - brokers
          - topics
          - consumers
        collection_interval: 10s

      postgresql/order-db:
        endpoint: "order-db:5432"
        transport: tcp
        username: "postgres"
        password: "postgres"
        databases:
          - "order_db"
        collection_interval: 10s
        tls:
          insecure: true

      postgresql/inventory-db:
        endpoint: "inventory-db:5432"
        transport: tcp
        username: "postgres"
        password: "postgres"
        databases:
          - "inventory_db"
        collection_interval: 10s
        tls:
          insecure: true

      prometheus/app-services:
        config:
          scrape_configs:
          - job_name: "order-service"
            metrics_path: "/metrics"
            static_configs:
              - targets: ["order-service:8080"]
                labels:
                  service: "order-service"
          - job_name: "inventory-service"
            metrics_path: "/metrics"
            static_configs:
              - targets: ["inventory-service:8081"]
                labels:
                  service: "inventory-service"
          - job_name: "websocket-service"
            metrics_path: "/metrics"
            static_configs:
              - targets: ["websocket-service:8082"]
                labels:
                  service: "websocket-service"
          - job_name: "auth-service"
            metrics_path: "/metrics"
            static_configs:
              - targets: ["auth-service:8083"]
                labels:
                  service: "auth-service"
          - job_name: "traefik"
            metrics_path: "/metrics"
            static_configs:
              - targets: ["traefik:8080"]
                labels:
                  service: "traefik"

    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "otel"

      otlphttp/tempo:
        endpoint: "http://tempo:4318"
        tls:
          insecure: true

      otlphttp/loki:
        endpoint: "http://loki:3100/loki/api/v1/push"

    processors:
      batch:
        timeout: 5s
        send_batch_size: 2000

      resource:
        attributes:
          - key: deployment.environment
            value: "development"
            action: upsert

    service:
      telemetry:
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: "0.0.0.0"
                    port: 8888

      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch, resource]
          exporters: [otlphttp/tempo]
        metrics:
          receivers:
            - otlp
            - redis
            - kafkametrics
            - prometheus/app-services
            - postgresql/order-db
            - postgresql/inventory-db
          processors: [batch, resource]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [batch, resource]
          exporters: [otlphttp/loki]
