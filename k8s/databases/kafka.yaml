apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: order-inventory
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: order-inventory
data:
  server.properties: |
    node.id=1
    process.roles=broker,controller
    controller.quorum.voters=1@localhost:9093
    listeners=PLAINTEXT://:9092,CONTROLLER://:9093
    advertised.listeners=PLAINTEXT://kafka:9092
    listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    controller.listener.names=CONTROLLER
    log.dirs=/var/lib/kafka/data
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1
    auto.create.topics.enable=true
    num.partitions=3
    default.replication.factor=1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: order-inventory
  labels:
    app: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          command:
            - /bin/sh
            - -c
            - |
              # 1. Format storage nếu dữ liệu KRaft chưa tồn tại
              if [ ! -f /var/lib/kafka/data/meta.properties ]; then
                echo "Formatting Kafka storage..."
                CLUSTER_ID=$(/opt/kafka/bin/kafka-storage.sh random-cluster-id)
                /opt/kafka/bin/kafka-storage.sh format -t $CLUSTER_ID -c /etc/kafka/server.properties --ignore-formatted
              fi

              # 2. Tạo một tiến trình chạy ngầm để chờ Kafka sẵn sàng rồi tự tạo topics
              (
                echo "Waiting for Kafka broker to respond..."
                until /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1; do
                  sleep 2
                done
                
                echo "Kafka is ready. Creating initial topics..."
                TOPICS="order.created order.paid order.confirmed order.cancelled order.shipped order.delivered order.status.changed inventory.reserved inventory.released inventory.updated inventory.low_stock inventory.reservation_failed dead_letter"
                
                for topic in $TOPICS; do
                  /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists --topic $topic --partitions 3 --replication-factor 1
                done
                echo "All initial Kafka topics created successfully!"
              ) &

              # 3. Chạy Kafka ở tiến trình chính (Foreground process)
              echo "Starting Kafka server..."
              exec /opt/kafka/bin/kafka-server-start.sh /etc/kafka/server.properties
          ports:
            - containerPort: 9092
              name: plaintext
            - containerPort: 9093
              name: controller
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
            - name: kafka-config
              mountPath: /etc/kafka/server.properties
              subPath: server.properties
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 25
            periodSeconds: 15
      volumes:
        - name: kafka-data
          persistentVolumeClaim:
            claimName: kafka-data
        - name: kafka-config
          configMap:
            name: kafka-config
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: order-inventory
  labels:
    app: kafka
spec:
  type: ClusterIP
  ports:
    - port: 9092
      targetPort: 9092
      name: plaintext
    - port: 9093
      targetPort: 9093
      name: controller
  selector:
    app: kafka