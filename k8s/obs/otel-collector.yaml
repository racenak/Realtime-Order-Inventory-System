apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: order-inventory
  labels:
    app: otel-collector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.160.0
          args: ["--config=/etc/otel/otel-collector.yml"]
          ports:
            - containerPort: 4317
              name: otlp-grpc
              protocol: TCP
            - containerPort: 4318
              name: otlp-http
              protocol: TCP
            - containerPort: 8888
              name: self-telemetry
              protocol: TCP
            - containerPort: 8889
              name: otel-metrics
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: otel-collector-config
              mountPath: /etc/otel/
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: otel-collector-config
          configMap:
            name: otel-collector-config
            items:
              - key: otel-collector.yml
                path: otel-collector.yml
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: order-inventory
  labels:
    app: otel-collector
spec:
  type: ClusterIP
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: self-telemetry
      port: 8888
      targetPort: 8888
      protocol: TCP
    - name: otel-metrics
      port: 8889
      targetPort: 8889
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: order-inventory
data:
  otel-collector.yml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      redis:
        endpoint: "redis:6379"
        collection_interval: 10s

      kafkametrics:
        brokers: ["kafka:9092"]
        protocol_version: 2.0.0
        scrapers:
          - brokers
          - topics
          - consumers
        collection_interval: 10s

      postgresql/order-db:
        endpoint: "order-db:5432"
        transport: tcp
        username: "postgres"
        password: "postgres"
        databases:
          - "order_db"
        collection_interval: 10s
        tls:
          insecure: true

      postgresql/inventory-db:
        endpoint: "inventory-db:5432"
        transport: tcp
        username: "postgres"
        password: "postgres"
        databases:
          - "inventory_db"
        collection_interval: 10s
        tls:
          insecure: true

      prometheus/app-services:
        config:
          scrape_configs:
          - job_name: "order-service"
            metrics_path: "/metrics"
            kubernetes_sd_configs:
            - role: endpoints
              namespaces:
                names: ["order-inventory"]
            relabel_configs:
            - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
              action: keep
              regex: order-service;http
            - source_labels: [__meta_kubernetes_pod_name]
              action: replace
              target_label: pod
            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              target_label: namespace
          - job_name: "inventory-service"
            metrics_path: "/metrics"
            kubernetes_sd_configs:
            - role: endpoints
              namespaces:
                names: ["order-inventory"]
            relabel_configs:
            - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
              action: keep
              regex: inventory-service;http
            - source_labels: [__meta_kubernetes_pod_name]
              action: replace
              target_label: pod
            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              target_label: namespace
          - job_name: "websocket-service"
            metrics_path: "/metrics"
            kubernetes_sd_configs:
            - role: endpoints
              namespaces:
                names: ["order-inventory"]
            relabel_configs:
            - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
              action: keep
              regex: websocket-service;http
            - source_labels: [__meta_kubernetes_pod_name]
              action: replace
              target_label: pod
            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              target_label: namespace
          - job_name: "auth-service"
            metrics_path: "/metrics"
            kubernetes_sd_configs:
            - role: endpoints
              namespaces:
                names: ["order-inventory"]
            relabel_configs:
            - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
              action: keep
              regex: auth-service;http
            - source_labels: [__meta_kubernetes_pod_name]
              action: replace
              target_label: pod
            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              target_label: namespace
          - job_name: "traefik"
            metrics_path: "/metrics"
            kubernetes_sd_configs:
            - role: endpoints
              namespaces:
                names: ["order-inventory"]
            relabel_configs:
            - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
              action: keep
              regex: traefik;dashboard
            - source_labels: [__meta_kubernetes_pod_name]
              action: replace
              target_label: pod
            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              target_label: namespace

    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "otel"

      otlphttp/tempo:
        endpoint: "http://tempo:4318"
        tls:
          insecure: true

      otlphttp/loki:
        endpoint: "http://loki:3100/loki/api/v1/push"

    processors:
      batch:
        timeout: 5s
        send_batch_size: 2000

      resource:
        attributes:
          - key: deployment.environment
            value: "development"
            action: upsert

    service:
      telemetry:
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: "0.0.0.0"
                    port: 8888

      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch, resource]
          exporters: [otlphttp/tempo]
        metrics:
          receivers:
            - otlp
            - redis
            - kafkametrics
            - prometheus/app-services
            - postgresql/order-db
            - postgresql/inventory-db
          processors: [batch, resource]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [batch, resource]
          exporters: [otlphttp/loki]
